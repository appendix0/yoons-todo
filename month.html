<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Month · Yoon's TO-DO</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/month.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="monthnav">
        <button id="prevMonth" class="iconbtn" type="button" aria-label="Previous month">&#8249;</button>
        <div id="monthTitle" class="brand">&mdash;</div>
        <button id="nextMonth" class="iconbtn" type="button" aria-label="Next month">&#8250;</button>
        <span id="daysLeft" class="card__hint"></span>
      </div>
      <div class="navs">
        <a class="navlink" href="plan.html">Plan</a>
        <a class="navlink navlink--primary" href="index.html">Today &#8594;</a>
      </div>
    </header>

    <main class="spread">
      <section class="page card" id="pageLeft">
        <div class="goals">
          <div class="card__head">
            <h2 class="card__title">This month's important things</h2>
            <span class="card__hint">At most three</span>
          </div>
          <div id="goalList"></div>
          <div id="alloc" class="alloc"></div>
        </div>
        <div id="weeksLeft" class="weeks"></div>
      </section>

      <section class="page card" id="pageRight">
        <div id="weeksRight" class="weeks"></div>
        <div class="notbox">
          <div class="card__head">
            <h2 class="card__title">Not this month</h2>
            <span class="card__hint">Delete before you optimize</span>
          </div>
          <textarea id="notList" class="notlist" placeholder="Things you are deliberately saying no to, one per line"></textarea>
        </div>
      </section>
    </main>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet__panel card" role="dialog" aria-label="Plan">
      <input id="pTitle" type="text" placeholder="Plan (e.g. CS285 HW2)" />
      <div class="sheet__dates">
        <label>From <input id="pStart" type="date" /></label>
        <label>To <input id="pEnd" type="date" /></label>
      </div>
      <div id="pTags" class="sheet__tags"></div>
      <div class="row-actions">
        <button id="pDone" class="btn" type="button">Mark done</button>
        <button id="pDelete" class="btn btn--danger" type="button">Delete</button>
        <button id="pClose" class="btn btn--primary" type="button">Done editing</button>
      </div>
    </div>
  </div>

  <script src="js/store.js?v=5"></script>
  <script src="js/month.js?v=2"></script>
</body>
</html>
