<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Yoon's TO-DO</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Yoon's <span>TO&#8209;DO</span></div>
      <a class="navlink" href="plan.html">Plan &#8594;</a>
    </header>

    <main class="dash">
      <section id="clockCard" class="card clockcard" hidden>
        <div id="clockDate" class="clock__date">&mdash;</div>
        <div id="clockTime" class="clock__time">00:00</div>
        <div id="clockSub" class="clock__sub"></div>
      </section>

      <button id="quoteCard" class="card quotecard" type="button" hidden aria-label="New quote">
        <div class="quote__mark" aria-hidden="true">&ldquo;</div>
        <div id="quoteText" class="quote__text"></div>
        <div id="quoteAttr" class="quote__attr"></div>
      </button>

      <section id="timeboxCard" class="card timebox" hidden>
        <div class="card__head">
          <h2 class="card__title">Time box</h2>
          <span class="card__hint">06:30&ndash;24:00 &middot; drag to reschedule</span>
        </div>
        <div class="scroll"><div id="cal" class="cal"></div></div>
      </section>

      <section id="todoCard" class="card todo" hidden>
        <div class="card__head"><h2 class="card__title">To&#8209;do</h2></div>
        <div class="progress">
          <div class="progress__bar"><div id="progressFill" class="progress__fill"></div></div>
          <span id="progressText" class="progress__text">0 / 0 done</span>
        </div>
        <div class="scroll"><div id="todoList"></div></div>
      </section>

      <div id="dashEmpty" class="dash-empty">
        <h2>No plan yet</h2>
        <p>Head to <b>Plan</b> to brain&#8209;dump today, rank it, and add fixed&#8209;time jobs.</p>
        <a class="btn btn--primary" href="plan.html">Start planning &#8594;</a>
      </div>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/dash.js"></script>
</body>
</html>
